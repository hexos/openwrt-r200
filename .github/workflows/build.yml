name: build-r200-openwrt

# 品速智联 R200（Qualcomm SDX55 / sdxprairie）OpenWrt 根文件系统全自动构建。
#
# 变体（workflow_dispatch 的 variant 输入）：
#   musl-core    纯 OpenWrt（musl）：能启动、能管好网络，但没有 5G/WiFi
#   musl-vendor  OpenWrt（musl）+ 原厂 glibc 厂商栈（默认）
#   glibc-vendor 用 glibc 从源码编 OpenWrt + 原厂厂商栈（慢，但 libc 最一致）
#
# 产物（Artifacts）：system.ubi + rawprogram/patch XML + 刷机说明 + 校验和

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "variant: musl-core | musl-vendor | glibc-vendor"
        default: "musl-core"
      openwrt_release:
        description: "OpenWrt version"
        default: "23.05.5"
      vendor_stack_url:
        description: "vendor stack tar.gz url (needed by *-vendor variants)"
        default: ""
      openwrt_target:
        description: "target (CPU must be cortex-a7)"
        default: "sunxi"
      openwrt_subtarget:
        description: "subtarget"
        default: "cortexa7"
      openwrt_profile:
        description: "profile used to build rootfs"
        default: "friendlyarm_nanopi-neo"
      packages:
        description: "override package list (empty = builtin default)"
        default: ""
      rootfs_url:
        description: "optional: direct rootfs.tar.gz url, skips build"
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    env:
      VARIANT: ${{ github.event.inputs.variant }}
      OPENWRT_RELEASE: ${{ github.event.inputs.openwrt_release }}
      OPENWRT_TARGET: ${{ github.event.inputs.openwrt_target }}
      OPENWRT_SUBTARGET: ${{ github.event.inputs.openwrt_subtarget }}
      OPENWRT_PROFILE: ${{ github.event.inputs.openwrt_profile }}
      ROOTFS_URL: ${{ github.event.inputs.rootfs_url }}
      PACKAGES: ${{ github.event.inputs.packages }}
      VENDOR_STACK_URL: ${{ github.event.inputs.vendor_stack_url }}

    steps:
      - uses: actions/checkout@v4

      - name: defaults for tag builds
        run: |
          : "${VARIANT:=musl-core}"
          : "${OPENWRT_RELEASE:=23.05.5}"
          : "${OPENWRT_TARGET:=sunxi}"
          : "${OPENWRT_SUBTARGET:=cortexa7}"
          : "${OPENWRT_PROFILE:=friendlyarm_nanopi-neo}"
          for v in VARIANT OPENWRT_RELEASE OPENWRT_TARGET OPENWRT_SUBTARGET OPENWRT_PROFILE; do
            val=$(eval echo \$$v)
            echo "$v=$val" >> "$GITHUB_ENV"
          done
          echo "variant=$VARIANT"

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git wget curl xz-utils zip unzip python3 \
            mtd-utils e2fsprogs squashfs-tools device-tree-compiler
          echo "mkfs.ubifs: $(command -v mkfs.ubifs)"
          echo "ubinize   : $(command -v ubinize)"
          chmod +x tools/*.sh

      - name: repo selftest
        run: python3 tools/selftest.py

      - name: fetch vendor stack
        if: contains(env.VARIANT, 'vendor')
        run: |
          if [ -z "$VENDOR_STACK_URL" ]; then
            echo "vendor variant needs vendor_stack_url" >&2
            echo "build it locally: python3 tools/prepare_vendor_stack.py <fw> -o vendor-stack" >&2
            echo "then: tar -czf vendor-stack.tar.gz -C vendor-stack . and upload it" >&2
            exit 1
          fi
          mkdir -p out/vendor-stack
          curl -fsSL --retry 3 -o out/vendor-stack.tar.gz "$VENDOR_STACK_URL"
          tar -xzf out/vendor-stack.tar.gz -C out/vendor-stack
          # Windows 上打出来的 tar 会丢可执行位，这里统一补回来
          chmod -R 0755 out/vendor-stack/opt/vendor/bin out/vendor-stack/opt/vendor/lib
          test -f out/vendor-stack/opt/vendor/lib/ld-linux-armhf.so.3
          python3 tools/prepare_vendor_stack.py --verify -o out/vendor-stack

      - name: fetch rootfs (imagebuilder, musl)
        if: ${{ !contains(env.VARIANT, 'glibc') }}
        run: bash tools/fetch_rootfs.sh out/rootfs-pkg

      - name: fetch rootfs (source build, glibc)
        if: contains(env.VARIANT, 'glibc')
        run: |
          git clone --depth 1 -b "v${OPENWRT_RELEASE}" https://github.com/openwrt/openwrt.git src
          cd src
          cp "$GITHUB_WORKSPACE/config/openwrt-glibc.seed" .config
          make defconfig
          if ! grep -q '^CONFIG_USE_GLIBC=y' .config; then
            echo "this target does not support glibc, use musl-vendor instead" >&2
            grep -E '^CONFIG_(USE_GLIBC|LIBC)' .config || true
            exit 1
          fi
          make -j"$(nproc)" V=s 2>&1 | tail -60
          bash "$GITHUB_WORKSPACE/tools/extract_rootfs.sh" "$PWD" \
               "$GITHUB_WORKSPACE/out/rootfs-pkg/rootfs"

      - name: normalize rootfs
        run: |
          ROOTFS=out/rootfs-pkg/rootfs
          test -x "$ROOTFS/sbin/init" -o -f "$ROOTFS/etc/preinit"
          echo "--- rootfs overview ---"
          ls "$ROOTFS"
          du -sh "$ROOTFS"
          rm -rf "$ROOTFS"/lib/modules/5.15*
          ls "$ROOTFS"/lib/ld-* 2>/dev/null || true

      - name: apply overlay
        run: |
          cp -a overlay/. out/rootfs-pkg/rootfs/
          chmod +x out/rootfs-pkg/rootfs/usr/sbin/r200-vendor-exec
          chmod +x out/rootfs-pkg/rootfs/etc/init.d/r200-vendor
          for f in out/rootfs-pkg/rootfs/etc/uci-defaults/*; do chmod +x "$f"; done

      - name: apply vendor stack
        if: contains(env.VARIANT, 'vendor')
        run: |
          cp -a out/vendor-stack/. out/rootfs-pkg/rootfs/
          echo "--- vendor stack landed ---"
          ls out/rootfs-pkg/rootfs/opt/vendor/bin
          ls out/rootfs-pkg/rootfs/lib/modules/*/extra/wlan.ko || echo "no wlan.ko"
          ls out/rootfs-pkg/rootfs/lib/firmware/wlan/qca_cld/ || true

      - name: build system.ubi
        run: |
          PAD_IMAGE=no bash tools/mksystemubi.sh out/rootfs-pkg/rootfs out/system.ubi
          ls -l out/system.ubi

      - name: verify ubi geometry
        run: python3 tools/check_ubi.py out/system.ubi

      - name: build edl flash package
        run: |
          python3 tools/gen_edl_pkg.py --fwdir firmware --out out/edl-r200 \
            --system out/system.ubi --no-pad

      - name: build info
        run: |
          {
            echo "variant=$VARIANT"
            echo "openwrt=$OPENWRT_RELEASE $OPENWRT_TARGET/$OPENWRT_SUBTARGET $OPENWRT_PROFILE"
            echo "built_at=$(date -u +%FT%TZ)"
            echo "ubi_size=$(stat -c %s out/system.ubi)"
          } > out/edl-r200/BUILD-INFO.txt
          cat out/edl-r200/BUILD-INFO.txt

      - name: pack
        run: |
          cd out
          zip -9 -r r200-openwrt-flash.zip edl-r200
          ls -l r200-openwrt-flash.zip

      - uses: actions/upload-artifact@v4
        with:
          name: r200-openwrt-${{ env.VARIANT }}
          path: |
            out/r200-openwrt-flash.zip
            out/edl-r200/SHA256SUMS
            out/edl-r200/BUILD-INFO.txt

      - name: summary
        run: |
          {
            echo "## R200 OpenWrt build ($VARIANT)"
            echo ""
            echo "- system.ubi: $(stat -c %s out/system.ubi) bytes"
            echo "- flash: unzip r200-openwrt-flash.zip, copy edl-r200/* next to prog_firehose_sdx55.mbn"
            echo "  and use QFIL with rawprogram_r200_openwrt.xml + patch_r200.xml"
          } >> "$GITHUB_STEP_SUMMARY"
